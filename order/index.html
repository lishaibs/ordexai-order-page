<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>הזמנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:#25D366;--green-dark:#128C7E;--green-pale:#f0faf4;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --border:#e8e8e8;--bg:#f5f5f5;--white:#fff;
  --radius:12px;--shadow:0 2px 8px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}

/* Header */
.hdr{background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hdr-logo{width:36px;height:36px;background:var(--green);border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-logo svg{width:20px;height:20px;fill:white}
.hdr-info{flex:1;min-width:0}
.hdr-org{font-size:15px;font-weight:700}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:1px}
.cart-badge{background:var(--green);color:white;font-size:11px;font-weight:700;
  min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;padding:0 5px;opacity:0;transform:scale(0.6);
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);cursor:pointer}
.cart-badge.on{opacity:1;transform:scale(1)}

/* Unmatched box */
.unmatched-box{background:#fff7e0;border:1px solid #ffcc66;padding:12px;margin:0 12px 8px;border-radius:8px}
.unmatched-header{font-weight:700;margin-bottom:8px;font-size:14px}
.unmatched-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
  border-bottom:1px solid rgba(255,204,102,0.3)}
.unmatched-row:last-child{border-bottom:none}
.unmatched-text{font-size:13px;flex:1;min-width:0}
.unmatched-find-btn{background:var(--green);color:white;border:none;padding:5px 12px;
  border-radius:6px;font-size:12px;font-family:'Heebo',sans-serif;cursor:pointer;flex-shrink:0;margin-right:8px}

/* Market tabs */
.mkt-tabs{background:var(--white);display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.mkt-tabs::-webkit-scrollbar{display:none}
.mkt-tab{flex:1;min-width:72px;padding:11px 8px;text-align:center;font-size:13px;font-weight:500;
  color:var(--text3);cursor:pointer;border-bottom:3px solid transparent;
  transition:all 0.15s;white-space:nowrap;user-select:none;font-family:'Heebo',sans-serif}
.mkt-tab.on{color:var(--green-dark);border-bottom-color:var(--green);font-weight:700}

/* Category bar */
.cat-bar{background:var(--white);padding:9px 12px;display:flex;gap:7px;overflow-x:auto;
  border-bottom:1px solid var(--border);position:sticky;top:61px;z-index:90}
.cat-bar::-webkit-scrollbar{display:none}
.cat-pill{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);
  font-size:12px;font-family:'Heebo',sans-serif;white-space:nowrap;cursor:pointer;
  color:var(--text2);background:var(--white);flex-shrink:0;transition:all 0.15s;user-select:none}
.cat-pill.on{background:var(--green);border-color:var(--green);color:white;font-weight:500}

/* Products */
.sec-title{padding:14px 16px 5px;font-size:10px;font-weight:700;color:var(--text3);
  letter-spacing:0.6px;text-transform:uppercase}
.pcard{background:var(--white);margin:0 12px 8px;border-radius:var(--radius);
  display:flex;align-items:center;gap:12px;padding:11px 12px;box-shadow:var(--shadow);
  animation:fadein 0.18s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.pimg{width:58px;height:58px;border-radius:8px;background:var(--green-pale);
  border:1px solid var(--border);flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:26px}
.pinfo{flex:1;min-width:0}
.pname{font-size:13px;font-weight:500;line-height:1.35}
.psku{font-size:10px;color:var(--text3);margin-top:2px;font-family:monospace}
.fav-suggested{font-size:10px;color:var(--green-dark);margin-top:2px}
.qty{display:flex;align-items:center;gap:9px;flex-shrink:0}
.qbtn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--white);font-size:17px;line-height:1;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--text2);transition:all 0.12s;
  user-select:none;-webkit-user-select:none;font-family:'Heebo',sans-serif}
.qbtn:active{transform:scale(0.88)}
.qbtn.plus.on{background:var(--green);border-color:var(--green);color:white}
.qbtn.minus{opacity:0.25}.qbtn.minus.on{opacity:1}
.qnum{font-size:15px;font-weight:700;min-width:20px;text-align:center}
.qnum.z{color:var(--text3);font-weight:400}

/* Favorites */
.add-all-favs-btn{display:block;width:calc(100% - 24px);margin:12px auto;padding:13px;
  background:var(--green);border:none;border-radius:var(--radius);color:white;
  font-size:14px;font-weight:600;font-family:'Heebo',sans-serif;cursor:pointer}
.add-all-favs-btn:active{transform:scale(0.98);opacity:0.9}
.fav-section{margin-top:8px}
.fav-section-title{padding:8px 16px;background:var(--bg);font-size:12px;font-weight:700;color:var(--text2)}

/* Cart view */
#catalog-view{padding-bottom:100px}
#cart-view{padding-bottom:140px}
.cart-header{background:var(--white);padding:12px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);position:sticky;top:61px;z-index:90}
.cart-back-btn{background:none;border:none;font-size:14px;color:var(--green-dark);
  cursor:pointer;font-family:'Heebo',sans-serif;font-weight:500}
.cart-title{font-size:16px;font-weight:700}
.cart-section{margin-top:12px}
.cart-section-title{padding:8px 16px;font-size:12px;font-weight:700;color:var(--text3);letter-spacing:0.5px}
.cart-row{background:var(--white);margin:0 12px 8px;border-radius:var(--radius);
  display:flex;justify-content:space-between;align-items:center;padding:12px;box-shadow:var(--shadow)}
.cart-row-info{flex:1;min-width:0}
.cart-row-name{font-size:13px;font-weight:500}
.cart-row-code{font-size:10px;color:var(--text3);margin-top:2px;font-family:monospace}
.cart-row-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.remove-btn{background:none;border:none;color:#e53935;font-size:18px;cursor:pointer;
  padding:2px 6px;line-height:1;font-family:'Heebo',sans-serif}
.empty-cart{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px}
.cart-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--white);
  border-top:1px solid var(--border);padding:10px 14px 14px;z-index:200}
.cart-reset-btn{width:100%;padding:10px;background:none;border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text2);font-size:13px;font-family:'Heebo',sans-serif;
  cursor:pointer;margin-bottom:8px}
.cart-send-btn{width:100%;padding:13px;border-radius:var(--radius);background:var(--green);border:none;
  color:white;font-size:15px;font-weight:700;font-family:'Heebo',sans-serif;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.cart-send-btn:active{transform:scale(0.98);opacity:0.9}
.cart-send-btn:disabled{background:var(--border);color:var(--text3);cursor:default}

/* Sticky footer (catalog view) */
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--white);
  border-top:1px solid var(--border);padding:10px 14px 14px;z-index:200}
.footer-btn{width:100%;padding:13px;border-radius:var(--radius);background:var(--green);border:none;
  color:white;font-size:15px;font-weight:600;font-family:'Heebo',sans-serif;cursor:pointer;
  transition:all 0.15s}
.footer-btn:active{transform:scale(0.98);opacity:0.9}
.footer-btn:disabled{background:var(--border);color:var(--text3);cursor:default}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;
  justify-content:center;z-index:1000}
.modal-content{background:white;border-radius:12px;max-width:90%;max-height:70vh;overflow-y:auto;
  padding:20px;min-width:280px;position:relative}
.modal-title{font-weight:700;font-size:15px;margin-bottom:12px;padding-left:30px}
.modal-close{position:absolute;top:12px;left:12px;background:none;border:none;
  font-size:22px;cursor:pointer;color:var(--text3);line-height:1}
.suggestion-row{padding:12px 8px;border-bottom:1px solid var(--border);cursor:pointer;
  border-radius:6px;transition:background 0.1s}
.suggestion-row:active{background:var(--green-pale)}
.suggestion-row:last-child{border-bottom:none}
.suggestion-name{font-size:14px;font-weight:500}
.suggestion-meta{font-size:11px;color:var(--text3);margin-top:2px;font-family:monospace}
.no-suggestions{text-align:center;padding:20px;color:var(--text3);font-size:13px}

/* States */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:55vh;gap:14px;color:var(--text3);font-size:13px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);
  border-radius:50%;animation:spin 0.75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:44px 24px;color:var(--text3);font-size:13px}
.empty .ei{font-size:36px;margin-bottom:10px;opacity:0.35}
.err{text-align:center;padding:44px 24px;color:#e53935;font-size:13px}
.err .ei{font-size:34px;margin-bottom:10px}

/* Toast */
.toast{position:fixed;bottom:118px;left:50%;transform:translateX(-50%) translateY(16px);
  background:rgba(0,0,0,0.72);color:white;padding:7px 16px;border-radius:18px;
  font-size:12px;font-family:'Heebo',sans-serif;opacity:0;transition:all 0.22s;
  pointer-events:none;white-space:nowrap;z-index:300}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-logo">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z M12 0C5.373 0 0 5.373 0 12c0 2.12.554 4.11 1.523 5.835L0 24l6.335-1.654C8.09 23.394 10.01 24 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
  </div>
  <div class="hdr-info">
    <div class="hdr-org" id="org-name">טוען...</div>
    <div class="hdr-sub">הזמנה חדשה</div>
  </div>
  <div class="cart-badge" id="badge" onclick="if(Object.keys(qty).length)switchView('cart')">0</div>
</div>

<!-- Unmatched box (conditional) -->
<div id="unmatched-box" class="unmatched-box hidden"></div>

<!-- Catalog view -->
<div id="catalog-view">
  <div id="mkt-tabs" class="mkt-tabs"></div>
  <div id="cat-bar" class="cat-bar"></div>
  <div id="plist"></div>
</div>

<!-- Cart view -->
<div id="cart-view" class="hidden">
  <div class="cart-header">
    <button class="cart-back-btn" onclick="switchView('catalog')">← חזור לקטלוג</button>
    <span class="cart-title">העגלה שלי</span>
  </div>
  <div id="cart-items"></div>
  <div class="cart-bottom" id="cart-bottom">
    <button class="cart-reset-btn" onclick="clearCart()">אפס סל</button>
    <button class="cart-send-btn" id="cart-send-btn" onclick="sendOrder()" disabled>
      🌐 שלח הזמנה ב-WhatsApp
    </button>
  </div>
</div>

<!-- Sticky footer (catalog view only) -->
<div class="footer" id="sticky-footer">
  <button class="footer-btn" id="footer-btn" onclick="switchView('cart')" disabled>
    בחר מוצרים להזמנה
  </button>
</div>

<!-- Unmatched suggestion modal -->
<div id="unmatched-modal" class="modal hidden" onclick="if(event.target===this)closeUnmatchedModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeUnmatchedModal()">×</button>
    <div class="modal-title" id="modal-title"></div>
    <div id="suggestions-list"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const CAT_EMOJI = {
  MOZZARELLA:'🧀', WHITE_BRINE:'🧀', CREAM_CHEESE:'🫙', HARD_CHEESE:'🧀',
  GOAT_SHEEP:'🐐', RICOTTA:'🥛', HALLOUMI:'🍳', CREAM:'🥛', YOGURT:'🥣',
  MILK:'🥛', BUTTER:'🧈', DESSERTS:'🍮', PASTA:'🍝', SPREADS:'🫙', OTHER:'🛒'
};

const API = "https://9q6xovizff.execute-api.eu-west-1.amazonaws.com";

let catalog = null;
let qty = {};
let activeTab = null;   // 'favorites' | market_type_id
let activeCat = null;   // category_id
let activeView = 'catalog'; // 'catalog' | 'cart'
let unmatchedItems = [];

// ── Init ─────────────────────────────────────────────────────────────────
async function init() {
  showLoading();
  const token = new URLSearchParams(location.search).get('t');
  if (!token) { showError('קישור לא תקין — חסר טוקן'); return; }

  try {
    const r = await fetch(`${API}/catalog?token=${encodeURIComponent(token)}`);
    if (r.status === 401) { showError('הקישור פג תוקף — בקש קישור חדש'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    catalog = await r.json();
  } catch (e) {
    showError('שגיאה בטעינת הקטלוג. בדוק חיבור ונסה שוב.');
    console.error(e);
    return;
  }

  unmatchedItems = [...(catalog.unmatchedItems || [])];

  // Pre-fill cart from existingOrder (T3 mode)
  if (catalog.existingOrder) {
    catalog.existingOrder.forEach(item => { qty[item.sku_code] = item.quantity; });
  }

  // Determine default active tab
  const hasFavorites = catalog.favorites && catalog.favorites.length > 0;
  const hasSession = catalog.existingOrder !== null;

  if (hasSession && catalog.existingOrder.length > 0) {
    // T3: default to market_type of first existing order item
    activeTab = catalog.existingOrder[0].market_type_id;
  } else if (hasFavorites) {
    // T4: default to favorites tab
    activeTab = 'favorites';
  } else {
    // T1: first market_type
    activeTab = catalog.marketTypes[0]?.id;
  }

  document.getElementById('org-name').textContent = catalog.org.name;
  document.title = 'הזמנה — ' + catalog.org.name;

  renderUnmatched();
  renderTabs();
  renderContent();
  updateFooter();
}

// ── Find SKU info from any source ────────────────────────────────────────
function findSku(code) {
  let s = catalog.skus.find(s => s.sku_code === code);
  if (s) return s;
  s = catalog.favorites?.find(f => f.sku_code === code);
  if (s) return s;
  s = catalog.existingOrder?.find(e => e.sku_code === code);
  if (s) return s;
  return { sku_code: code, name: code, market_type_id: null };
}

// ── Tabs ─────────────────────────────────────────────────────────────────
function renderTabs() {
  const container = document.getElementById('mkt-tabs');
  container.innerHTML = '';

  const hasFavorites = catalog.favorites && catalog.favorites.length > 0;
  if (hasFavorites) {
    const tab = document.createElement('div');
    tab.className = 'mkt-tab' + (activeTab === 'favorites' ? ' on' : '');
    tab.textContent = 'מועדפים שלי';
    tab.dataset.id = 'favorites';
    tab.onclick = () => switchTab('favorites');
    container.appendChild(tab);
  }

  catalog.marketTypes.forEach(mt => {
    const tab = document.createElement('div');
    tab.className = 'mkt-tab' + (activeTab === mt.id ? ' on' : '');
    tab.textContent = mt.name;
    tab.dataset.id = mt.id;
    tab.onclick = () => switchTab(mt.id);
    container.appendChild(tab);
  });
}

function switchTab(tabId) {
  activeTab = tabId;
  activeCat = null;
  document.querySelectorAll('.mkt-tab').forEach(t =>
    t.classList.toggle('on', t.dataset.id === String(tabId))
  );
  renderContent();
}

// ── Content dispatcher ───────────────────────────────────────────────────
function renderContent() {
  const catBar = document.getElementById('cat-bar');
  if (activeTab === 'favorites') {
    catBar.innerHTML = '';
    catBar.style.display = 'none';
    renderFavoritesTab();
  } else {
    catBar.style.display = '';
    renderCategoryBar();
    renderMarketTab();
  }
}

// ── Category bar ─────────────────────────────────────────────────────────
function renderCategoryBar() {
  const bar = document.getElementById('cat-bar');
  const skusInMarket = catalog.skus.filter(s => s.market_type_id === activeTab);
  const catIds = [...new Set(skusInMarket.map(s => s.category_id))];
  const cats = catalog.categories.filter(c => catIds.includes(c.id));

  bar.innerHTML = '';
  if (!cats.length) { activeCat = null; return; }

  if (!activeCat || !catIds.includes(activeCat)) {
    activeCat = cats[0].id;
  }

  cats.forEach(cat => {
    const pill = document.createElement('div');
    pill.className = 'cat-pill' + (activeCat === cat.id ? ' on' : '');
    pill.textContent = cat.name || cat.code;
    pill.dataset.id = cat.id;
    pill.onclick = () => {
      activeCat = cat.id;
      document.querySelectorAll('.cat-pill').forEach(p =>
        p.classList.toggle('on', p.dataset.id === cat.id)
      );
      pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      renderMarketTab();
    };
    bar.appendChild(pill);
  });
}

// ── Market type product list ─────────────────────────────────────────────
function renderMarketTab() {
  const list = document.getElementById('plist');
  const skus = catalog.skus.filter(s =>
    s.market_type_id === activeTab && s.category_id === activeCat
  );

  if (!skus.length) {
    list.innerHTML = '<div class="empty"><div class="ei">🔍</div>אין מוצרים בקטגוריה זו</div>';
    return;
  }

  list.innerHTML = '';
  const mt = catalog.marketTypes.find(m => m.id === activeTab);
  const cat = catalog.categories.find(c => c.id === activeCat);

  const title = document.createElement('div');
  title.className = 'sec-title';
  title.textContent = (cat?.name || '') + ' · ' + (mt?.name || '');
  list.appendChild(title);

  skus.forEach((sku, idx) => {
    list.appendChild(createProductCard(sku.sku_code, sku.name, idx));
  });
}

// ── Favorites tab ────────────────────────────────────────────────────────
function renderFavoritesTab() {
  const list = document.getElementById('plist');
  list.innerHTML = '';
  const hasSession = catalog.existingOrder !== null;

  // "Add all favorites to cart" button — only in T4 mode (no session)
  if (!hasSession) {
    const btn = document.createElement('button');
    btn.className = 'add-all-favs-btn';
    btn.textContent = '+ הוסף את הקבועים שלי לסל';
    btn.onclick = addAllFavorites;
    list.appendChild(btn);
  }

  // Group favorites by market_type
  const grouped = {};
  catalog.favorites.forEach(fav => {
    const mtId = fav.market_type_id;
    if (!grouped[mtId]) grouped[mtId] = [];
    grouped[mtId].push(fav);
  });

  Object.entries(grouped).forEach(([mtId, favs]) => {
    const mt = catalog.marketTypes.find(m => m.id === mtId);
    const section = document.createElement('div');
    section.className = 'fav-section';

    const title = document.createElement('div');
    title.className = 'fav-section-title';
    title.textContent = (mt?.name || 'אחר') + ' (' + favs.length + ' מוצרים)';
    section.appendChild(title);

    favs.forEach((fav, idx) => {
      const sugQty = hasSession ? null : fav.suggested_qty;
      section.appendChild(createProductCard(fav.sku_code, fav.name, idx, sugQty));
    });

    list.appendChild(section);
  });
}

// ── Product card ─────────────────────────────────────────────────────────
function createProductCard(skuCode, name, idx, suggestedQty) {
  const q = qty[skuCode] || 0;
  const card = document.createElement('div');
  card.className = 'pcard';
  card.style.animationDelay = (idx * 25) + 'ms';

  const sku = catalog.skus.find(s => s.sku_code === skuCode);
  const cat = sku ? catalog.categories.find(c => c.id === sku.category_id) : null;
  const emoji = (cat && CAT_EMOJI[cat.code]) || '🛒';

  const safeCode = skuCode.replace(/'/g, "\\'");
  const sugHtml = (suggestedQty && q === 0) ? '<div class="fav-suggested">מוצע: ' + suggestedQty + '</div>' : '';

  card.innerHTML =
    '<div class="pimg">' + emoji + '</div>' +
    '<div class="pinfo">' +
      '<div class="pname">' + name + '</div>' +
      '<div class="psku">' + skuCode + '</div>' +
      sugHtml +
    '</div>' +
    '<div class="qty">' +
      '<button class="qbtn minus' + (q > 0 ? ' on' : '') + '" onclick="chg(\'' + safeCode + '\',-1)">−</button>' +
      '<span class="qnum' + (q === 0 ? ' z' : '') + '" id="q' + skuCode + '">' + q + '</span>' +
      '<button class="qbtn plus' + (q > 0 ? ' on' : '') + '" onclick="chg(\'' + safeCode + '\',1)">+</button>' +
    '</div>';

  return card;
}

// ── Quantity change ──────────────────────────────────────────────────────
function chg(code, delta) {
  const cur = qty[code] || 0;
  const next = Math.max(0, cur + delta);
  if (next === 0) delete qty[code]; else qty[code] = next;

  const el = document.getElementById('q' + code);
  if (el) {
    el.textContent = next;
    el.className = 'qnum' + (next === 0 ? ' z' : '');
    const ctrl = el.parentElement;
    ctrl.querySelector('.minus').className = 'qbtn minus' + (next > 0 ? ' on' : '');
    ctrl.querySelector('.plus').className = 'qbtn plus' + (next > 0 ? ' on' : '');
  }

  updateFooter();
  if (activeView === 'cart') renderCart();
  if (delta > 0 && next > 0) toast(findSku(code).name + ' × ' + next);
}

function addAllFavorites() {
  catalog.favorites.forEach(fav => { qty[fav.sku_code] = fav.suggested_qty; });
  updateFooter();
  switchView('cart');
}

// ── View switching ───────────────────────────────────────────────────────
function switchView(view) {
  activeView = view;
  document.getElementById('catalog-view').classList.toggle('hidden', view !== 'catalog');
  document.getElementById('cart-view').classList.toggle('hidden', view !== 'cart');
  document.getElementById('sticky-footer').classList.toggle('hidden', view !== 'catalog');
  document.getElementById('cart-bottom').classList.toggle('hidden', view !== 'cart');

  const box = document.getElementById('unmatched-box');
  if (unmatchedItems.length === 0) {
    box.classList.add('hidden');
  } else {
    box.classList.toggle('hidden', view !== 'catalog');
  }

  if (view === 'cart') renderCart();
  if (view === 'catalog') renderContent();
  window.scrollTo(0, 0);
}

// ── Cart view ────────────────────────────────────────────────────────────
function renderCart() {
  const list = document.getElementById('cart-items');
  list.innerHTML = '';

  const items = Object.entries(qty).filter(([_, q]) => q > 0);

  if (items.length === 0) {
    list.innerHTML = '<div class="empty-cart">העגלה ריקה</div>';
    document.getElementById('cart-send-btn').disabled = true;
    return;
  }

  document.getElementById('cart-send-btn').disabled = false;

  // Group by market_type
  const grouped = {};
  items.forEach(([code, q]) => {
    const info = findSku(code);
    const mt = catalog.marketTypes.find(m => m.id === info.market_type_id);
    const key = mt?.name || 'אחר';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push({ code, qty: q, name: info.name });
  });

  Object.entries(grouped).forEach(([mtName, groupItems]) => {
    const section = document.createElement('div');
    section.className = 'cart-section';

    const title = document.createElement('div');
    title.className = 'cart-section-title';
    title.textContent = mtName;
    section.appendChild(title);

    groupItems.forEach(({ code, qty: q, name }) => {
      const safeCode = code.replace(/'/g, "\\'");
      const row = document.createElement('div');
      row.className = 'cart-row';
      row.innerHTML =
        '<div class="cart-row-info">' +
          '<div class="cart-row-name">' + name + '</div>' +
          '<div class="cart-row-code">' + code + '</div>' +
        '</div>' +
        '<div class="cart-row-controls">' +
          '<button class="qbtn minus on" onclick="chg(\'' + safeCode + '\',-1)">−</button>' +
          '<span class="qnum">' + q + '</span>' +
          '<button class="qbtn plus on" onclick="chg(\'' + safeCode + '\',1)">+</button>' +
          '<button class="remove-btn" onclick="removeFromCart(\'' + safeCode + '\')">×</button>' +
        '</div>';
      section.appendChild(row);
    });

    list.appendChild(section);
  });
}

function removeFromCart(code) {
  delete qty[code];
  renderCart();
  updateFooter();
}

function clearCart() {
  qty = {};
  renderCart();
  updateFooter();
}

// ── Send order ───────────────────────────────────────────────────────────
function sendOrder() {
  const items = Object.entries(qty).filter(([_, q]) => q > 0);
  if (items.length === 0) return;

  const lines = items.map(([code, q]) => code + ' X ' + q);
  const text = '🌐 הזמנה מ-OrdexAI\n' + lines.join('\n');

  const phone = (catalog.distributorPhone || '').replace(/\D/g, '');
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(text), '_blank');
}

// ── Unmatched items ──────────────────────────────────────────────────────
function renderUnmatched() {
  const box = document.getElementById('unmatched-box');
  if (!unmatchedItems || unmatchedItems.length === 0) {
    box.classList.add('hidden');
    return;
  }

  box.classList.remove('hidden');
  box.innerHTML = '<div class="unmatched-header">⚠ פריטים שלא זוהו</div>';

  unmatchedItems.forEach(function(item, idx) {
    const row = document.createElement('div');
    row.className = 'unmatched-row';

    const text = document.createElement('span');
    text.className = 'unmatched-text';
    text.textContent = item.text;
    row.appendChild(text);

    const btn = document.createElement('button');
    btn.className = 'unmatched-find-btn';
    btn.textContent = 'מצא בקטלוג';
    btn.onclick = function() { openUnmatchedModal(idx); };
    row.appendChild(btn);

    box.appendChild(row);
  });
}

function openUnmatchedModal(idx) {
  const item = unmatchedItems[idx];
  const modal = document.getElementById('unmatched-modal');
  document.getElementById('modal-title').textContent = 'הצעות עבור "' + item.text + '"';

  const list = document.getElementById('suggestions-list');
  list.innerHTML = '';

  if (!item.suggestions || item.suggestions.length === 0) {
    list.innerHTML = '<div class="no-suggestions">לא נמצאו הצעות מתאימות</div>';
  } else {
    item.suggestions.forEach(function(sug) {
      const row = document.createElement('div');
      row.className = 'suggestion-row';
      row.innerHTML =
        '<div class="suggestion-name">' + sug.name + '</div>' +
        '<div class="suggestion-meta">' + sug.sku_code + '</div>';
      row.onclick = function() { pickSuggestion(idx, sug); };
      list.appendChild(row);
    });
  }

  modal.classList.remove('hidden');
}

function closeUnmatchedModal() {
  document.getElementById('unmatched-modal').classList.add('hidden');
}

function pickSuggestion(unmatchedIdx, sug) {
  qty[sug.sku_code] = (qty[sug.sku_code] || 0) + 1;
  unmatchedItems.splice(unmatchedIdx, 1);
  renderUnmatched();
  renderContent();
  updateFooter();
  closeUnmatchedModal();
  toast(sug.name + ' נוסף לסל');
}

// ── Footer / badge ───────────────────────────────────────────────────────
function updateFooter() {
  const n = Object.keys(qty).length;
  const units = Object.values(qty).reduce(function(a, b) { return a + b; }, 0);

  const badge = document.getElementById('badge');
  badge.textContent = n;
  badge.classList.toggle('on', n > 0);

  const btn = document.getElementById('footer-btn');
  btn.disabled = n === 0;
  btn.textContent = n === 0
    ? 'בחר מוצרים להזמנה'
    : n + ' פריטים · ' + units + ' יחידות ←';
}

// ── Helpers ──────────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('plist').innerHTML =
    '<div class="loading"><div class="spinner"></div>טוען קטלוג...</div>';
}
function showError(msg) {
  document.getElementById('org-name').textContent = 'שגיאה';
  document.getElementById('plist').innerHTML =
    '<div class="err"><div class="ei">⚠️</div>' + msg + '</div>';
}
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function() { t.classList.remove('on'); }, 1800);
}

init();
</script>
</body>
</html>
